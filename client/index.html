    <meta
      name="description"
      content="CareerCompass: your AI-powered career mentor"
    />
    <title>CareerCompass</title>
    <script>
      try {
        var t = localStorage.getItem("theme") || "dark";
        if (t === "dark") document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <style>
      html {
        background: #f8fafc;
      }
      html.dark {
        background: #020617;
      }
